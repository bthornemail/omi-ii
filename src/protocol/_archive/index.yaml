protocol:
  name: omi_reverse_omicron
  objective: >
    To define a deterministic, zero-assumption protocol for generating,
    carrying, and projecting coordinates using only bitwise rotation and XOR.
    The protocol must produce a spec that can be implemented as a TypeScript
    interface, tested, and used as a portable codec or runtime resolver.
  use_case: >
    A closed coordinate system where no number is predefined and no
    arithmetic is used. It can be used for deterministic addressing,
    parity-based synchronization, and mnemonic encoding without trusting
    a kernel, server, or hardware abstraction.
  entry_point:
    - "Start at all-zero state."
    - "The only mutable parameter is C, the carry-forward witness."

