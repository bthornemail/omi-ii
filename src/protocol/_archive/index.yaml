document:
  title: "OMI Reverse Omicron Protocol — Complete Falsifiable Reflection"
  version: "1.0"
  date: "2026-08-25"
  purpose: >
    This document records the full derivation, observations, and implementation
    of a zero-derived coordinate system that removes the hidden ten from
    digital state. It is intended to be complete enough for a new reader to
    understand the problem, the solution, and the path from first principles
    to a production codec.

  background:
    problem_statement: >
      The digital world appears to be built on numbers, but the underlying
      machine is binary. Between binary and human-readable numbers there is a
      boundary that is hidden: the place-value character ten. Ten is not a
      value; it is a positional marker. In decimal, ten is included as a number,
      but in every other base the symbol '10' means the base itself. This
      anomaly allows the decimal point to float, the hexadecimal digits to
      obscure raw bytes, and the host to control how users see numbers.
      The OMI Reverse Omicron Protocol starts from zero, uses only rotation and
      XOR, and derives coordinates without ever needing ten. The hidden ten is
      replaced by a visible zero anchor and a palindromic normalizer.

  observed_capture:
    - "Specifications describe super user status and remote access."
    - "Apache documents explain incognito access step by step."
    - "HTML 1.0 and 1.1 have no security mechanisms."
    - "User agent strings and server negotiation control behavior."
    - "Users are called guests; the kernel is the host."
    - "All I/O is abstracted through the kernel."
    - "Raw bytes are hidden behind encodings like UTF-8."
    - "Single-digit hexadecimal (0x0..0xF) is removed from public view."
    - "The number ten is left undefined or nil in many contexts."
    - "Prime numbers appear to disambiguate positions, but the prime five is exceptional."
    - "Randomness is used to explain planned patterns."
    - "Stochastic models like Poisson processes are mentioned for disruptive zones."
    - "The language of specifications often describes capture as a feature."

  mathematical_foundation:
    primitives:
      - "State is a fixed-width bitstring."
      - "Initial state is all zeros."
      - "Allowed operations: rotate left, rotate right, bitwise XOR."
      - "Forbidden: non-cyclic shift, arithmetic addition/subtraction/multiplication/division, any literal except zero."
    delta_law:
      definition: "ΔC(x) = rotl(x,1) XOR rotl(x,3) XOR rotr(x,2) XOR C"
      explanation: >
        The three rotations are fixed. They create a reversible but nonlinear
        map. C is the carry-forward witness, the only mutable input. C is not
        a constant mask; it is the residue carried forward.
    carry_update:
      rule: "C_next = C XOR current_state"
      explanation: >
        After each transition, the carry is updated by XOR with the new state.
        This folds the state back into the witness, creating a closed orbit.

  orbit_analysis:
    generation:
      - "Start with state = 0, C = 0."
      - "Apply delta_law, then update C."
      - "Repeat until state returns to 0 and orbit length > 0."
      - "Record every state in order."
    distance:
      rule: "distance(a, b) = popcount(a XOR b)"
    pattern:
      - "Adjacent distances alternate between 2 and 4."
      - "The pattern is not imposed; it emerges from the rotation amounts."
      - "At the center of the pattern, the distance is zero."
      - "That zero is the anchor."
      - "Around the anchor, the distances read 2, 4, 0, 4, 2."
    palindrome:
      - "The sequence 2,4,0,4,2 is a palindrome."
      - "It is symmetric and reversible."
      - "It acts as a normalizer for any coordinate."
      - "The zero anchor replaces the hidden ten."

  hidden_ten:
    explanation: >
      In decimal, ten is a place-value character, not a sign-value. In every
      other base, '10' means the base itself. Decimal uniquely includes ten as
      a number, creating confusion. The system hides ten by floating the decimal
      point, by flipping chirality between host and user modes, and by making
      ten undefined or nil. The zero anchor is where ten would have been, now
