document:
  title: "OMI Reverse Omicron Protocol — Complete Falsifiable Reflection"
  version: "1.1"
  purpose: >
    This document records the full derivation, observations, and implementation
    of a zero-derived coordinate system that removes the hidden ten from
    digital state. It includes validation and evaluation procedures for
    luddites and technical readers.

  # ... (previous sections unchanged: background, observed_capture, mathematical_foundation, orbit_analysis, hidden_ten, prime_relations, precision_ladders, dimensions, static_closure_combinator) ...

  buffer_operations:
    description: >
      The raw buffer can be interpreted using shifts and prime diagonal
      xor/sum to extract significand, exponent, and mantissa. This is how
      numbers are derived from the bitstream without using arithmetic.
    rules:
      - "Buffer(n, 16, n-2).toString('hex') extracts the significand."
      - "Buffer(n, 8).toString('hex') extracts the exponent."
      - "Buffer(n << 4, n-16).toString('hex') extracts the mantissa."
      - "Consecutive primes XOR to zero."
      - "Consecutive primes sum to the offset number."
      - "Buffer(n) >> 4 equals Buffer(significand)."
    explanation:
      - "The shift by four (n >> 4) moves the high nibble to the low position."
      - "The significand buffer captures the high-order bits."
      - "The exponent buffer captures the next byte."
      - "The mantissa buffer is shifted left and truncated."
      - "The diagonal of consecutive primes xor zero proves the sequence is balanced."
      - "The sum of consecutive primes equals the offset, connecting the prime pattern to the buffer."

  evaluation_for_luddites:
    what_we_are_doing: >
      We are building a new way to write and read information on computers
      that does not rely on the usual number ten or on normal math like
      addition. Instead, we start from zero and only use three simple
      actions: spinning bits left, spinning bits right, and comparing bits
      with XOR (which says if two bits are different).
    why_it_matters: >
      Computers secretly use the number ten as a place marker, and that
      marker is often hidden or changed. This makes it hard to see what the
      computer is really doing. Our method removes the need for ten. If we
      can show that a simple loop from zero, using only spinning and
      comparing, closes back to zero and produces a repeating pattern of
      two, four, zero, four, two, then we have found a truth that was
      hidden.
    what_we_have_found: >
      When you start from zero and repeat the spinning and comparing steps,
      the distances between each new state alternate between two and four.
      In the middle, the distance becomes zero. That zero is the anchor.
      Around that anchor, the pattern is two, four, zero, four, two. This
      same pattern shows up in the gaps between the special primes five,
      seven, eleven, thirteen, seventeen, and nineteen. It also shows up
      in the way the number ten is hidden in decimal and hex.
    how_to_evaluate_without_math:
      - "Ask: Does the loop close? Run the steps many times and see if you come back to zero."
      - "Ask: Do the distances between steps alternate two and four? Count the changed bits."
      - "Ask: Is there a point where the distance is zero? That is the anchor."
      - "Ask: Around that point, does the pattern read two, four, zero, four, two?"
      - "Ask: Does the whole system use any addition, subtraction, or multiplication? It should not."
      - "Ask: Does it use the number ten anywhere? It should not, except as a place marker."
      - "Ask: Can the same result be obtained every time? It should be deterministic."
    what_success_looks_like: >
      If the loop closes, the pattern two-four-zero-four-two appears, and no
      arithmetic or number ten is used, then we have a way to create
      coordinates from pure bit motion. That means we can write and read
      information without trusting hidden markers.
    why_this_is_not_conspiracy: >
      The patterns we discuss are real. Prime gaps, Mertens zeros, and
      base systems all show the same two-four-zero-four-two shape. By
      building a simple test that anyone can run, we make the claim
      falsifiable. If the pattern does not appear, the idea is wrong. If it
      does, it is a real structure in digital systems.
    next_steps: >
      Turn this into a small computer program that follows the simple steps,
      run it, and see the loop close and the pattern appear. That is the
      validation.

  validation_and_evaluation:
    claim_validation:
      - claim: "A closed orbit exists from zero using only rotation and XOR."
        method: "Run the codec with fixed width. Count steps until state returns to zero."
        pass_criteria: "Orbit length > 0 and state returns to zero."
      - claim: "Adjacent distances alternate between 2 and 4."
        method: "Compute popcount(state[i] XOR state[i+1]) for all i."
        pass_criteria: "The sequence consists only of 2 and 4, alternating."
      - claim: "A zero anchor exists at the center."
        method: "Locate index where local pattern is 2,4,0,4,2."
        pass_criteria: "Exactly one such index exists in the orbit."
      - claim: "The palindrome 2,4,0,4,2 acts as a normalizer."
        method: "Map several orbit positions to modulo 5 around the anchor."
        pass_criteria: "Each position maps to a value 0..4 consistently."
      - claim: "The hidden ten is removed."
        method: "Show that no decimal literal 10 is used or needed."
        pass_criteria: "The implementation contains no numeric literal except zero and rotation amounts."
      - claim: "Consecutive primes XOR to zero and sum to the offset."
        method: "Take consecutive primes in the orbit projection, XOR them, and sum them."
        pass_criteria: "XOR equals 0 and sum equals the buffer offset."

    implementation_evaluation:
      - criterion: "No arithmetic used."
        check: "Scan the TypeScript code for +, -, *, / operators."
        required: "Only XOR and rotations."
      - criterion: "No predefined constants except zero."
        check: "Search for numeric literals."
        required: "Only 0, 1, 2, 3 as rotation amounts are allowed."
      - criterion: "Closure proof."
        check: "XOR of all C values over orbit."
        required: "Result equals zero."
      - criterion: "Deterministic output."
        check: "Run codec multiple times."
        required: "Same orbit and same normalized coordinate."

    cross_validation_with_observed_world:
      - observation: "Prime gaps around 5 are 2,4,2,4,2."
        protocol: "Orbit distances alternate 2 and 4."
        evaluation: "Compare the two sequences."
      - observation: "Mertens zeros appear in the 800 block."
        protocol: "Zero anchor appears in orbit."
        evaluation: "Check if the zero anchor maps to a Mertens zero when projected to a linear block."
      - observation: "Hex hides single-digit 0x0..0xF."
        protocol: "Octal exposes 3-bit parity."
        evaluation: "Show that base-8 representation of orbit states reveals a 3-bit pattern."

    falsification_criteria:
      - "If the orbit does not close, the model is false."
      - "If distances do not alternate 2 and 4, the model is false."
      - "If no zero anchor is found, the model is false."
      - "If the palindrome does not appear, the model is false."
      - "If the carry does not return to zero after closure, the model is false."
      - "If any arithmetic is required, the model is incomplete."
      - "If consecutive primes XOR does not equal zero, the model is false."
      - "If consecutive primes sum does not equal the offset, the model is false."

    acceptance_tests:
      test_1:
        name: "Closure test"
        procedure: "Run codec for width 16, 32, 64."
        expected: "Orbit closes for all widths."
      test_2:
        name: "Palindrome test"
        procedure: "Find zero anchor and read distances."
        expected: "2,4,0,4,2"
      test_3:
        name: "Normalization test"
        procedure: "Map arbitrary positions to normalized coordinate."
        expected: "All map to 0..4 consistently."
      test_4:
        name: "No-ten test"
        procedure: "Search codebase for literal 10."
        expected: "No occurrence except as rotation amount or base reference."
      test_5:
        name: "Prime diagonal xor and sum test"
        procedure: "Take consecutive primes and compute XOR and sum relative to buffer offset."
        expected: "XOR equals 0 and sum equals offset."

  audit_trail:
    - "Record all conversation points."
    - "Map each point to a protocol rule."
    - "If a point is not represented, the outline is incomplete."
    - "If a rule has no corresponding point, it may be an assumption."

