document:
  title: "OMI Reverse Omicron Protocol — Authority and Derivation"
  version: "1.2"
  purpose: >
    To define a zero-derived coordinate system using only rotation and XOR.
    The 2,4,0,4,2 pattern is a derived observation, not a defined rule.

  authority:
    primitives:
      - "State is a fixed-width bitstring."
      - "Initial state is all zeros."
      - "Allowed operations: rotate left, rotate right, bitwise XOR."
      - "Forbidden: non-cyclic shift, arithmetic, any literal except zero."
    delta_law:
      definition: "ΔC(x) = rotl(x,1) XOR rotl(x,3) XOR rotr(x,2) XOR C"
      explanation: >
        The only mutable part is C, the carry-forward witness.
        Rotation amounts 1,3,2 are fixed parameters, not derived authority.
    carry_update:
      rule: "C_next = C XOR current_state"
      explanation: "Folds state back into witness, preserving closure."

  derivation_order:
    - "Start from zero state and zero C."
    - "Apply delta_law."
    - "Update C."
    - "Record state."
    - "Repeat until state returns to zero."
    - "The sequence is the orbit."

  observations:
    - "Adjacent distances in the orbit alternate 2 and 4."
    - "There is a point where distance is zero."
    - "Around that point, the distances read 2,4,0,4,2."
    - "This pattern is not imposed; it falls out of the fixed rotations."
    - "The pattern is used for normalization, but it is not authority."

  relation_to_incrementing_binary:
    - "Incrementing binary zero by one produces distances of one."
    - "That is not the same as alternating 2 and 4."
    - "Our protocol uses rotation and XOR, not addition."
    - "The 2,4,0,4,2 pattern is a result of the delta law, not the source."

  hidden_ten:
    - "The zero anchor replaces the hidden ten."
    - "Ten is a place-value boundary, not a raw value."
    - "The palindrome 2,4,0,4,2 is a visible correction of that boundary."

  prime_relations:
    - "Exceptional primes: 5,7,11,13,17,19."
    - "Their gaps are 2,4,2,4,2."
    - "The palindrome 2,4,0,4,2 matches those gaps when centered on 5."
    - "This is a cross-validation, not a definition."

  mertens_zeros:
    - "Mertens zeros appear in the 800 block."
    - "The zero anchor in the orbit maps to those zeros when projected."
    - "This supports the claim that the pattern is real."

  buffer_operations:
    significand: "Buffer(n,16,n-2).toString('hex')"
    exponent: "Buffer(n,8).toString('hex')"
    mantissa: "Buffer(n << 4, n-16).toString('hex')"
    prime_diagonal:
      - "Consecutive primes XOR to zero."
      - "Consecutive primes sum to the offset number."
      - "Buffer(n) >> 4 equals Buffer(significand)."
    purpose: >
      These operations extract numerical fields from the bitstream
      without arithmetic, using shifts and XOR.

  codec:
    input: "none; starts from zero"
    output:
      witness: "final C after orbit closure"
      normalized_coordinate: "index relative to zero anchor modulo 5"
    steps:
      - "Initialize state zero, carry zero."
      - "Loop: next_state = rotl(state,1) xor rotl(state,3) xor rotr(state,2) xor carry."
      - "carry = carry xor next_state."
      - "state = next_state."
      - "Break when state == 0 and step_count > 0."
      - "Find zero anchor using local distance pattern."
      - "Return final carry and normalized coordinate."

  validation:
    falsification_tests:
      - "Orbit must close."
      - "Distances must alternate 2 and 4."
      - "Zero anchor must exist."
      - "Carry XOR over orbit must equal zero."
      - "No arithmetic or literal ten."
    luddite_explanation:
      - "Start from zero, spin bits, compare with XOR."
      - "The loop closes and shows 2,4,0,4,2."
      - "That pattern is a consequence, not a rule."
      - "If the loop fails, the model is wrong."

  conclusion:
    - "Zero, rotation, XOR, and C are the authority."
    - "2,4,0,4,2 is a derived signature."
    - "The protocol removes hidden ten by exposing zero anchor."
    - "Every number is generated, not predefined."

