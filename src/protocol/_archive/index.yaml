  - step: 2
    title: "Define the transition law"
    procedure:
      - "Transition ΔC(x) = rotl(x,1) XOR rotl(x,3) XOR rotr(x,2) XOR C."
      - "C is the only entry point."
    observation: "The law is closed and reversible under rotation."

  - step: 3
    title: "Generate an orbit"
    procedure:
      - "Start from zero."
      - "Apply ΔC repeatedly."
      - "Stop when state returns to zero."
    observation: "The orbit is a closed loop. No information is lost."

  - step: 4
    title: "Observe adjacent distances"
    procedure:
      - "Measure distance between successive states in the orbit."
    observation: "Distances alternate between 2 and 4."

  - step: 5
    title: "Locate the zero anchor"
    procedure:
      - "Find the point in the orbit where distance is zero."
      - "Read around it."
    observation: "The pattern is 2,4,0,4,2."

  - step: 6
    title: "Derive the quadratic form"
    procedure:
      - "Pair orbit states."
      - "Count pairings."
    observation: "The form is Q = 60x² + 16xy + 4y²."

  - step: 7
    title: "Factor the form"
    procedure:
      - "Factor Q into 4(15x² + 4xy + y²)."
      - "Factor again into 4(4x² + 11x² + 4xy + y²)."
    observation: "The coefficients 60, 15, 11, 4 are scale variants."

  - step: 8
    title: "Update carry-forward C"
    procedure:
      - "C_next = C XOR current_state."
    observation: "C moves forward without arithmetic."

  - step: 9
    title: "Apply precision ladders"
    procedure:
      - "Binary square ladder: square two repeatedly."
      - "Base-three square ladder: square three repeatedly."
      - "Factorial ladder: multiply up to seven."
      - "Use each step to modify C."
    observation: "Scale changes are only bitwise modifications of C."

  - step: 10
    title: "Close the orbit"
    procedure:
      - "XOR all C values over a full cycle."
    observation: "Closure occurs when the XOR equals zero."

  - step: 11
