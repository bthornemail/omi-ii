principles:
  - name: zero_origin
    explanation: >
      The system begins with a state of all zero bits because zero needs no
      external definition. It is the only allowed literal. Everything else
      must be produced by operations on that initial state.
  - name: closed_bit_motion
    explanation: >
      Only rotations are permitted for moving bits. Rotations wrap the
      bitstring end to end. No bit is dropped, no new bit is created. This
      preserves total information and makes every step reversible.
  - name: xor_as_relation
    explanation: >
      XOR compares two states without adding or subtracting. It marks
      difference as one and sameness as zero. This makes it a pure relation
      operator. The transition law uses XOR to combine three rotations of
      the state into one new state.
  - name: carry_forward_witness
    explanation: >
      The value C is not a constant mask. It is the only moving part of the
      system. C carries forward the residue from previous steps. It is
      updated by XORing the current state, so the update stays inside the
      allowed bit operations.
  - name: orbit_closure
    explanation: >
      Repeated application of the delta law from zero eventually returns to
      zero. The full path before returning is the orbit. Closure means the
      XOR of all carry values over the orbit is zero. This is the proof that
      no information was lost.
  - name: alternating_gap
    explanation: >
      Along the orbit, the distances between states alternate between two and
      four. This is not an assumed pattern. It comes from the fixed rotation
      amounts in the delta law. The alternation is the first observable
      structure produced by the system.
  - name: palindromic_center
    explanation: >
      The alternating gaps have a point where the distance is zero. Placing
      that point in the middle of the gap sequence gives two, four, zero,
      four, two. The zero is the anchor. The pattern reads the same forward
      and backward.
  - name: quadratic_invariant
    explanation: >
      The orbit symmetries produce a scalar form with three terms. The
      coefficients are determined by the number of ways the orbit pairs
      states. The form factors into smaller variants without changing its
      meaning. Each variant is a different coordinate view of the same orbit.
  - name: scale_ladders
    explanation: >
      Moving to a larger scale does not introduce new numbers. It modifies
      the carry C through repeated bit motion. Binary squaring, base-three
      squaring, and factorial growth are three ladders. Each ladder step is
      a deterministic change to C.
  - name: observer_as_coordinate
    explanation: >
      Observation is not a state change. It is a coordinate selection. A
      pure system has twelve or twenty-four dimensions. Including an observer
      adds one dimension. Including a peer connection adds two dimensions.
  - name: projection_without_predefinition
    explanation: >
      Linear blocks and prime positions are not written in advance. They are
      produced by projecting the closed orbit onto a straight line. The
      two-four-zero-four-two sequence acts as a normalizer for any projected
      coordinate.

