principles:
  - name: zero_origin
    explanation: >
      Start from an all-zero state. Zero is not a value but an unobserved
      boundary. The system has no pre-assigned numbers and no external
      authority. Every later position must be generated.

  - name: rotation_not_shift
    explanation: >
      Only cyclic rotations move bits. Rotate left and rotate right wrap the
      bitstring. A shift introduces an edge and loses information. Rotation
      preserves the orbit.

  - name: xor_as_view
    explanation: >
      XOR is a view, not arithmetic. Viewing a state through a mask is the
      operation itself. Every activity is a XOR coordination. A coordinate
      is produced by XORing a null or a number into the carry-forward.

  - name: delta_law
    explanation: >
      The transition is DeltaC of x equals rotate left by one XOR rotate left
      by three XOR rotate right by two XOR C. The rotation amounts are fixed.
      C is the only entry point.

  - name: carry_forward_C
    explanation: >
      C is the carried closure witness. It is not a constant. It evolves as
      the carry-forward. The pattern is x XOR one y XOR two x XOR three y
      XOR four x XOR five y. Even positions map to x, odd positions map to y.
      Each step updates C using only bitwise operations.

  - name: orbit_generation
    explanation: >
      Repeatedly apply the delta law from zero. The sequence of states forms
      an orbit. The orbit closes when the state returns to zero. The closure
      is lossless and periodic.

  - name: prime_gap_emergence
    explanation: >
      Distances between adjacent states in the orbit alternate between two
      and four. This is not forced. It emerges from the rotation parameters.
      The two and four are the first visible rhythm.

  - name: palindromic_anchor
    explanation: >
      The alternating gaps have a central zero distance. Reading around the
      center gives two, four, zero, four, two. The zero is the anchor. The
      anchor is the observer position, not an operation.

  - name: quadratic_form
    explanation: >
      The orbit symmetries produce Q of x and y equals sixty x squared plus
      sixteen x y plus four y squared. The coefficients sixty, sixteen, and
      four are not arbitrary. They count orbit pairings. The form factors
      into four times fifteen x squared plus four x y plus y squared, and
      also into four times four x squared plus eleven x squared plus four x y
      plus y squared.

