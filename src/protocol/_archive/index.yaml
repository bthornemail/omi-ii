codec:
  name: omi_reverse_omicron_codec
  description: >
    A deterministic bitwise codec that generates a closed orbit from zero,
    carries a single witness C, and returns that witness with a normalized
    coordinate derived from the 2,4,0,4,2 pattern.
  fixed_width: 64
  input_type: fixed-width bitstring
  output_type: object
  output_fields:
    witness: bitstring
    normalized_coordinate: integer
    orbit_length: integer
  initial_state: 0b0
  initial_carry: 0b0
  allowed_operations:
    - rotl
    - rotr
    - xor
  forbidden:
    - shift
    - arithmetic
    - literals_other_than_zero
  delta_law:
    definition: "ΔC(x) = rotl(x,1) xor rotl(x,3) xor rotr(x,2) xor C"
    rotation_amounts: [1, 3, 2]
  operation_order:
    - "Apply delta_law using current state and current C."
    - "Set new state to the result."
    - "Update C by C = C xor new_state."
  orbit_generation:
    - "Start with state = 0, C = 0."
    - "Repeat operation_order until state returns to 0 and orbit length is greater than 0."
    - "Record every new state in the orbit."
  closure_procedure:
    - "Stop when state equals 0 and at least one full step has occurred."
  zero_anchor_procedure:
    - "Compute distance between adjacent states in the orbit."
    - "The zero anchor is the first index where the distance is zero and the distance before and after alternates as two and four."
  normalization_procedure:
    - "Take the orbit positions around the zero anchor."
    - "Map the local sequence to [2,4,0,4,2]."
    - "The normalized coordinate is the index of the current state relative to the zero anchor."
  encoding:
    - "Run orbit_generation."
    - "Return the final C as witness."
  decoding:
    - "Start from zero state and zero C."
    - "Run orbit_generation using the witness as a checkpoint."
    - "If the generated orbit matches the witness, decoding is valid."
  error_behavior:
    - "If orbit does not close within fixed_width * 8 steps, return error."
    - "If no zero anchor is found, return error."
    - "If normalized coordinate is outside 0..4, return error."

